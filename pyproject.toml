[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcha"
version = "0.1.0"
description = "Orcha financial assistant with deterministic cash-flow planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pydantic>=2.0.0",
    "python-dotenv",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pytest",
    "ruff",
    "mypy",
    "httpx>=0.27,<1",
]

[project.scripts]
orcha = "orcha.cli:main"
orcha-web = "orcha.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orcha.web" = ["static/*", "static/**/*"]
"orcha.demo" = ["*.json", "dataset/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["private_data: optional checks requiring the original private dataset"]
